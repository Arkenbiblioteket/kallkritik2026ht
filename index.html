
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanningsdetektiven</title>

<style>
* { box-sizing: border-box; }

:root {
    --blue: #276a9b;
    --blue-dark: #174c75;
    --green: #27834a;
    --red: #c93636;
    --text: #18334a;
    --light-blue: #f2f7fb;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.35)),
        url("bakgrund.jpg") no-repeat center center fixed;
    background-size: cover;
    color: var(--text);
}

.container {
    width: 100%;
    max-width: 1050px;
    height: 92vh;
    min-height: 500px;
    background: rgba(255,255,255,.97);
    border-radius: 28px;
    padding: 32px;
    overflow-y: auto;
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
    display: flex;
    flex-direction: column;
}

h1,h2,h3,p { text-align: center; }
h1 { font-size: 36px; }
h2 { font-size: 30px; }
p { line-height: 1.6; }

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 15px;
    font-size: 20px;
    font-weight: 600;
    padding: 15px 24px;
    transition: transform .15s, background .15s;
}
button:hover { transform: translateY(-2px); }
button:focus-visible,a:focus-visible {
    outline: 4px solid #f0a500;
    outline-offset: 4px;
}
button:disabled { cursor: default; opacity: 1; transform: none; }

.blue { background: var(--blue); color: white; }
.blue:hover { background: var(--blue-dark); }
.green { background: var(--green); color: white; }
.red { background: var(--red); color: white; }

.header-img {
    display: block;
    margin: auto auto 25px;
    max-width: 650px;
    width: 100%;
    max-height: 55vh;
    object-fit: contain;
    border-radius: 20px;
}

.question-img {
    display: block;
    max-width: 640px;
    max-height: 34vh;
    width: 100%;
    object-fit: contain;
    margin: 0 auto 20px;
    border-radius: 18px;
}

.quiz-img {
    display: block;
    max-width: 560px;
    max-height: 48vh;
    width: 100%;
    object-fit: contain;
    margin: 0 auto;
    border-radius: 24px;
}

.center-page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 16px;
}

.intro-text {
    max-width: 800px;
    font-size: 25px;
    margin: 5px auto 15px;
}

.question-number {
    font-size: 25px;
    font-weight: 800;
    color: var(--blue);
    margin-bottom: 12px;
}

.question-text {
    font-size: 29px;
    font-weight: 650;
    line-height: 1.4;
    margin: 18px auto 25px;
    max-width: 850px;
}

.progress-wrap {
    max-width: 700px;
    width: 100%;
    margin: 0 auto 22px;
}

.progress-label {
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
}

.progress-track {
    height: 12px;
    background: #dce5ec;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 20px;
    transition: width .25s;
}

.answer-options {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 16px;
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
}

.answer-btn {
    display: flex;
    align-items: center;
    gap: 15px;
    min-height: 105px;
    padding: 18px;
    border: 3px solid #b7c9d9;
    border-radius: 17px;
    background: var(--light-blue);
    color: var(--text);
    text-align: left;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
}

.answer-btn:hover {
    background: #dcecf8;
    border-color: var(--blue);
}

.answer-letter {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--blue);
    color: white;
    font-size: 22px;
    font-weight: 800;
}

.answer-btn.correct-choice {
    border-color: var(--green);
    background: #e0f4e6;
}
.answer-btn.correct-choice .answer-letter { background: var(--green); }

.answer-btn.wrong-choice {
    border-color: var(--red);
    background: #fde6e6;
}
.answer-btn.wrong-choice .answer-letter { background: var(--red); }

.feedback {
    max-width: 820px;
    width: 100%;
    margin: 25px auto 0;
    text-align: center;
}

.feedback-title {
    font-size: 30px;
    font-weight: 800;
    margin: 10px 0;
}

.feedback-explanation {
    font-size: 22px;
    line-height: 1.6;
    margin: 15px auto;
}

.reaction-img {
    display: block;
    max-width: 180px;
    max-height: 150px;
    object-fit: contain;
    margin: 10px auto;
}

.score-card {
    width: min(650px,100%);
    border-radius: 22px;
    padding: 24px;
    background: #f2f7fb;
    margin: 12px auto;
}

.score-number {
    font-size: clamp(48px,10vw,88px);
    line-height: 1.15;
    font-weight: 900;
    color: var(--blue);
    margin: 10px 0;
}

.score-track {
    height: 20px;
    background: #dce5ec;
    border-radius: 20px;
    overflow: hidden;
    margin: 20px 0;
}

.score-fill {
    height: 100%;
    background: var(--green);
    transition: width .5s;
}

.news-grid {
    display: grid;
    grid-template-columns: repeat(5,minmax(0,1fr));
    gap: 12px;
    max-width: 700px;
    width: 100%;
    margin: 15px auto;
}

.news-btn {
    background: white;
    border: 2px solid #d6e0e8;
    border-radius: 12px;
    padding: 10px;
    min-width: 0;
}
.news-btn:hover { border-color: var(--blue); background: #f2f7fb; }
.news-btn img { width: 100%; height: 65px; object-fit: contain; }

.action-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    margin: 20px auto 5px;
}

.person-grid {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    margin: 20px auto;
    width: 100%;
}

.person-grid img {
    display: block;
    max-width: 320px;
    max-height: 40vh;
    width: 100%;
    object-fit: contain;
    border-radius: 22px;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,.18);
}

.person-grid img:hover { transform: scale(1.02); }

.small-note { font-size: 16px; color: #536879; }

.hidden { display: none !important; }

@media (max-width:700px) {
    body { padding: 8px; }
    .container {
        height: 96vh;
        min-height: 0;
        padding: 20px 15px;
        border-radius: 20px;
    }
    h1 { font-size: 29px; }
    h2 { font-size: 25px; }
    .intro-text { font-size: 21px; }
    .question-text { font-size: 24px; }
    .question-number { font-size: 22px; }
    .answer-options { grid-template-columns: 1fr; gap: 11px; }
    .answer-btn { min-height: 78px; padding: 13px; font-size: 18px; }
    .answer-letter { width: 40px; height: 40px; font-size: 19px; }
    .feedback-explanation { font-size: 19px; }
    .news-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .news-btn img { height: 55px; }
    .person-grid { flex-direction: column; gap: 15px; }
    .person-grid img { max-width: 250px; max-height: 28vh; }
    button { font-size: 18px; }
    .header-img { max-height: 45vh; }
    .question-img { max-height: 27vh; }
}

@media (prefers-reduced-motion: reduce) {
    *,*::before,*::after { transition: none !important; }
}
</style>
</head>

<body>

<audio id="applauseSound" src="applaus.wav" preload="auto"></audio>
<audio id="booSound" src="bu.wav" preload="auto"></audio>

<div class="container" id="startScreen">
    <div class="center-page">
        <img src="start.jpg" class="header-img" alt="Sanningsdetektiven">
        <h1>Sanningsdetektiven</h1>
        <p class="intro-text">
            Kan du känna igen bluffar, falska nyheter och
            information som inte går att lita på?
        </p>
        <p>14 frågor · 1 poäng för varje rätt svar · Max 14 poäng</p>
        <button class="blue" onclick="startGame()">Starta</button>
    </div>
</div>

<div class="container" id="game" style="display:none;"></div>

<script>
"use strict";

/*
  correct: 0 = A, 1 = B, 2 = C, 3 = D
  Alla 14 frågor räknas in i samma poängsumma.
*/

const questions = [
{
    q:"Google visar alltid den bästa informationen först i träfflistan.",
    img:"googlesok.jpg",
    options:[
        "Ja, Google kontrollerar att allt är sant.",
        "Ja, de översta träffarna är alltid bäst.",
        "Nej, de översta träffarna kan vara reklam eller populära sidor.",
        "Nej, Google visar bara gamla webbsidor."
    ],
    correct:2,
    explanation:"De första träffarna är inte alltid de bästa. Vissa är annonser och andra kan ligga högt för att de är populära. Titta på vem som står bakom sidan och jämför gärna flera källor."
},
{
    q:"AI är så bra i dag att den alltid har rätt.",
    img:"ai.jpg",
    options:[
        "Ja, AI gör aldrig några misstag.",
        "Ja, om AI kommer från ett stort företag.",
        "Nej, AI kan ge felaktiga svar och hitta på information.",
        "Nej, AI kan bara svara på engelska."
    ],
    correct:2,
    explanation:"AI kan låta säker även när svaret är fel. Den kan missa viktig information eller hitta på uppgifter. Kontrollera därför viktiga fakta med tillförlitliga källor."
},
{
    q:"Det jag delar på nätet går alltid att ta tillbaka.",
    img:"ungdomar.jpg",
    options:[
        "Ja, om jag tar bort inlägget direkt.",
        "Ja, efter en vecka försvinner allt.",
        "Nej, men bara bilder kan sparas.",
        "Nej, andra kan ha sparat, skärmdumpat eller delat det vidare."
    ],
    correct:3,
    explanation:"Det som delas på nätet kan spridas snabbt. Andra kan spara material, ta skärmdumpar eller skicka det vidare. Tänk därför efter innan du publicerar något."
},
{
    q:"Vad är smartast att göra innan du tror på en nyhet?",
    img:"nyheter.jpg",
    options:[
        "Dela den direkt så att fler får veta.",
        "Kontrollera om flera trovärdiga källor rapporterar samma sak.",
        "Lita på den om den har många gilla-markeringar.",
        "Tro på den om en kompis har skickat den."
    ],
    correct:1,
    newsLinks:true,
    explanation:"Jämför uppgifterna med flera trovärdiga källor. Titta på vem som publicerat nyheten och om det finns belägg för det som påstås. Många delningar betyder inte automatiskt att något är sant."
},
{
    q:"Du säljer en jacka på Vinted. Köparen skriver att hen swishat för mycket och ber dig swisha tillbaka mellanskillnaden. Vad gör du?",
    img:"ungdomar.jpg",
    options:[
        "Swishar tillbaka direkt, det är ju ärligt.",
        "Ber om en skärmdump på betalningen och swishar sedan.",
        "Swishar tillbaka halva summan.",
        "Kontrollerar själv i Swish att betalningen verkligen kommit in och kontaktar plattformen eller banken om något verkar fel."
    ],
    correct:3,
    explanation:"Kontrollera själv i Swish att betalningen verkligen har kommit in och vilket belopp du har fått. En skärmdump kan vara manipulerad. Skicka inte tillbaka pengar enbart för att någon ber dig."
},
{
    q:"Du får en sexsiffrig kod från Snapchat. Direkt efter skriver en kompis: ”Oj, jag skrev fel nummer, kan du skicka koden till mig?”",
    img:"luras.jpg",
    options:[
        "Du skickar koden, det är ju din kompis.",
        "Du skickar bara hälften av siffrorna.",
        "Du frågar kompisen varför hen behöver den.",
        "Du skickar inte koden. Om du misstänker ett intrång säkrar du kontot."
    ],
    correct:3,
    explanation:"Koden är till för att komma in på ditt konto. Någon kan försöka logga in som dig, och kompisens konto kan vara hackat. Dela aldrig inloggningskoder."
},
{
    q:"Du får ett samtal från okänt nummer. Rösten låter som din pappa: ”Jag har tappat min telefon. Swisha 2 000 kr till det här numret, snabbt!”",
    img:"luras.jpg",
    options:[
        "Du swishar, det är ju pappa.",
        "Du ber om numret så du kan swisha senare.",
        "Du lägger på och ringer pappa på hans vanliga nummer.",
        "Du frågar vad han heter i mellannamn."
    ],
    correct:2,
    explanation:"AI kan härma röster. Brådska är ett varningstecken. Ring upp på ett nummer du redan har och kontrollera med personen innan du skickar pengar."
},
{
    q:"Du ser en annons på Instagram: märkessneakers för 299 kr (vanligt pris 2 000 kr). ”Endast idag, bara 3 kvar!” Vad är mest troligt?",
    img:"luras.jpg",
    options:[
        "En falsk webbshop som tar betalt och aldrig skickar något.",
        "En riktig rea.",
        "Skorna är begagnade men fina.",
        "Butiken har gjort ett prisfel."
    ],
    correct:0,
    explanation:"Ett orimligt lågt pris och tidspress kan vara tecken på en bluffbutik. Kontrollera företaget och webbadressen innan du handlar."
},
{
    q:"Ett inlägg lovar gratis pengar. I kommentarerna står det: ”Det funkar, fick 5 000 kr!” Vad är starkaste varningstecknet?",
    img:"luras.jpg",
    options:[
        "Att det finns många kommentarer.",
        "Att inlägget är gratis.",
        "Att det ligger en bild på en känd person.",
        "Att kommentarerna kommer från konton med få inlägg, konstiga namn och nästan likadan text."
    ],
    correct:3,
    explanation:"Falska konton och likadana kommentarer kan användas för att få en bluff att verka äkta. Många kommentarer eller ett känt ansikte bevisar ingenting."
},
{
    q:"Någon på Discord skriver: ”Gratis Nitro! Skanna den här QR-koden i appen.” Vad kan hända om du skannar den?",
    img:"luras.jpg",
    options:[
        "Du får Nitro.",
        "Bedragaren kan få tillgång till ditt konto.",
        "Ingenting händer.",
        "Appen uppdateras."
    ],
    correct:1,
    explanation:"Vissa QR-koder kan användas för att lura dig att logga in eller godkänna en inloggning. Skanna inte oväntade koder och kontrollera erbjudanden via Discords egna kanaler."
},
{
    q:"En kompis konto delar en video: ”Skolan stänger imorgon, dela vidare!” Vad gör du först?",
    img:"luras.jpg",
    options:[
        "Delar vidare så att alla vet.",
        "Kollar hur många likes videon har.",
        "Kollar skolans hemsida eller frågar en lärare.",
        "Skriver i klasschatten och frågar om någon vet."
    ],
    correct:2,
    explanation:"Kontrollera informationen hos en källa som faktiskt vet, till exempel skolans hemsida eller en lärare. Likes och klasschatten kan bara sprida ryktet vidare."
},
{
    q:"Du hittar en bild på en haj som simmar på en översvämmad gata. Vad är bästa sättet att ta reda på om den är äkta?",
    img:"luras.jpg",
    options:[
        "Göra en bildsökning och se om bilden finns på pålitliga nyhetssajter.",
        "Titta efter om bilden är skarp.",
        "Räkna hur många som delat den.",
        "Fråga en kompis vad hen tror."
    ],
    correct:0,
    explanation:"En omvänd bildsökning kan visa var bilden förekommit tidigare och om den använts i ett annat sammanhang. Kontrollera också datum och pålitliga nyhetskällor."
},
{
    q:"Någon i ditt spel erbjuder att byta ditt sällsynta skin mot tre andra ”för att vara snäll” och skickar en länk till en ”tradesida”. Vad är risken?",
    img:"luras.jpg",
    options:[
        "Du blir bannad automatiskt.",
        "Skinsen visar sig vara sämre.",
        "Inga risker, det är bara ett byte.",
        "Sidan kan vara falsk och stjäla ditt konto eller dina föremål."
    ],
    correct:3,
    explanation:"Gör byten via spelets egna, officiella funktioner. Länkar från andra spelare kan leda till falska sidor som försöker stjäla dina inloggningsuppgifter eller föremål."
},
{
    q:"Du ber en AI-chatt om källor till din skoluppgift. Den ger dig tre boktitlar med författare. Vad gör du?",
    img:"luras.jpg",
    options:[
        "Skriver upp dem direkt i uppgiften.",
        "Kollar att böckerna finns på riktigt, till exempel via biblioteket.",
        "Frågar AI:n ”är du säker?” och litar på svaret.",
        "Ber AI:n hitta på fler."
    ],
    correct:1,
    explanation:"AI kan hitta på böcker, författare och källor som låter trovärdiga. Kontrollera att källorna finns på riktigt, till exempel i bibliotekets katalog eller hos ett förlag."
}
];

let current = 0;
let score = 0;
let answered = false;

const game = document.getElementById("game");

function playSound(id) {
    const sound = document.getElementById(id);
    if (!sound) return;

    sound.currentTime = 0;
    const playback = sound.play();

    if (playback && typeof playback.catch === "function") {
        playback.catch(() => {});
    }
}

function startGame() {
    current = 0;
    score = 0;
    answered = false;

    document.getElementById("startScreen").style.display = "none";
    game.style.display = "flex";

    showIntroduction();
}

function showIntroduction() {
    game.innerHTML = `
        <div class="center-page">
            <img src="luras.jpg" class="question-img"
                 alt="Tänk efter innan du litar på information på nätet">
            <p class="intro-text">
                Det är viktigt att tänka sig för när man surfar på
                internet. Med AI och annan smart teknik är det lätt
                att bli lurad.
                <br><br>
                Svara på 14 frågor om källkritik och säkerhet på nätet.
                Varje rätt svar ger en poäng. Du ser ditt slutresultat
                efter den sista frågan.
            </p>
            <button class="blue" onclick="showQuestion()">Starta quiz</button>
        </div>
    `;
}

function showQuestion() {
    answered = false;

    const q = questions[current];
    const letters = ["A", "B", "C", "D"];
    const progress = (current / questions.length) * 100;

    const optionsHtml = q.options.map((option, index) => `
        <button type="button" class="answer-btn"
                data-answer="${index}"
                onclick="answer(${index})">
            <span class="answer-letter">${letters[index]}</span>
            <span>${escapeHtml(option)}</span>
        </button>
    `).join("");

    game.innerHTML = `
        <div class="progress-wrap">
            <div class="progress-label">
                Fråga ${current + 1} av ${questions.length}
                &nbsp; · &nbsp; Poäng: ${score}
            </div>
            <div class="progress-track" role="progressbar"
                 aria-valuenow="${current + 1}" aria-valuemin="1"
                 aria-valuemax="${questions.length}">
                <div class="progress-fill" style="width:${progress}%"></div>
            </div>
        </div>

        <div id="question">
            <div class="question-number">Sanningsdetektiven</div>
            <img src="${q.img}" class="question-img"
                 alt="Bild till fråga ${current + 1}"
                 onerror="this.style.display='none'">
            <div class="question-text">${escapeHtml(q.q)}</div>
        </div>

        <div class="answer-options">${optionsHtml}</div>
        <div id="feedback" class="feedback" aria-live="polite"></div>
    `;

    game.scrollTop = 0;
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;",
        '"':"&quot;", "'":"&#39;"
    })[char]);
}

function answer(selected) {
    if (answered) return;
    answered = true;

    const q = questions[current];
    const correct = selected === q.correct;
    const buttons = game.querySelectorAll(".answer-btn");

    buttons.forEach((button, index) => {
        button.disabled = true;
        if (index === q.correct) button.classList.add("correct-choice");
        if (index === selected && !correct) button.classList.add("wrong-choice");
    });

    if (correct) {
        score++;
        playSound("applauseSound");
    } else {
        playSound("booSound");
    }

    const feedback = document.getElementById("feedback");
    const reactionImg = correct ? "glad.jpg" : "oops.jpg";
    const resultTitle = correct
        ? `<div class="feedback-title" style="color:#27834a;">✓ RÄTT SVAR! +1 POÄNG</div>`
        : `<div class="feedback-title" style="color:#c93636;">✗ FEL SVAR</div>`;

    let newsButtons = "";

    if (q.newsLinks) {
        newsButtons = `
            <h3>Jämför nyheten med andra källor</h3>
            <p class="small-note">Klicka på en logotyp för att öppna webbplatsen.</p>
            <div class="news-grid">
                <button class="news-btn" onclick="openNews('https://www.svt.se')" aria-label="Öppna SVT"><img src="svt.jpg" alt="SVT"></button>
                <button class="news-btn" onclick="openNews('https://www.sverigesradio.se')" aria-label="Öppna Sveriges Radio"><img src="sr.jpg" alt="Sveriges Radio"></button>
                <button class="news-btn" onclick="openNews('https://www.dn.se')" aria-label="Öppna Dagens Nyheter"><img src="dn.jpg" alt="Dagens Nyheter"></button>
                <button class="news-btn" onclick="openNews('https://www.bbc.com/news')" aria-label="Öppna BBC News"><img src="bbc.jpg" alt="BBC News"></button>
                <button class="news-btn" onclick="openNews('https://www.google.se')" aria-label="Öppna Google"><img src="google.jpg" alt="Google"></button>
            </div>
        `;
    }

    feedback.innerHTML = `
        ${resultTitle}
        <p><strong>Din poäng hittills: ${score} av ${questions.length}</strong></p>
        <img src="${reactionImg}" class="reaction-img"
             alt="${correct ? "Glad reaktion" : "Oj, fel svar"}"
             onerror="this.style.display='none'">
        <p class="feedback-explanation">${escapeHtml(q.explanation)}</p>
        ${newsButtons}
        <div class="action-row">
            <button class="blue" onclick="nextQuestion()">
                ${current === questions.length - 1 ? "Se slutresultatet" : "Nästa fråga"}
            </button>
        </div>
    `;

    feedback.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function openNews(url) {
    window.open(url, "_blank", "noopener,noreferrer");
}

function nextQuestion() {
    if (!answered) return;

    current++;

    if (current >= questions.length) {
        showResultPage();
        return;
    }

    showQuestion();
}

function showResultPage() {
    const total = questions.length;
    const percent = Math.round((score / total) * 100);

    let title, message, image;

    if (score === total) {
        title = "Fantastiskt detektivarbete!";
        message = "Alla rätt! Du är riktigt bra på att tänka källkritiskt och upptäcka varningssignaler.";
        image = "glad.jpg";
    } else if (score >= 10) {
        title = "Mycket bra jobbat!";
        message = "Du har bra koll på många varningssignaler. Fortsätt att kontrollera innan du klickar, delar eller betalar.";
        image = "glad.jpg";
    } else if (score >= 6) {
        title = "Bra jobbat!";
        message = "Du kan redan en hel del. Kom ihåg att stanna upp, tänka efter och kontrollera informationen.";
        image = "glad.jpg";
    } else {
        title = "Nu har du lärt dig något nytt!";
        message = "Öva på att känna igen bluffar och kontrollera information. Det viktigaste är att stanna upp när något verkar konstigt eller för bra för att vara sant.";
        image = "oops.jpg";
    }

    game.innerHTML = `
        <div class="center-page">
            <h1>Ditt resultat</h1>
            <div class="score-card">
                <p>Du fick</p>
                <div class="score-number">${score} / ${total}</div>
                <p><strong>poäng (${percent} % rätt)</strong></p>
                <div class="score-track">
                    <div class="score-fill" style="width:${percent}%"></div>
                </div>
                <p class="small-note">Varje rätt svar gav 1 poäng. Fel svar gav 0 poäng.</p>
            </div>

            <img src="${image}" class="reaction-img" alt="Din resultatbild"
                 onerror="this.style.display='none'">
            <h2>${title}</h2>
            <p class="intro-text">${message}</p>

            <div class="action-row">
                <button class="blue" onclick="restartQuiz()">Gör quizet igen</button>
                <button class="green" onclick="showPersonPage()">Fortsätt</button>
            </div>
        </div>
    `;

    game.scrollTop = 0;
}

function restartQuiz() {
    current = 0;
    score = 0;
    answered = false;
    showIntroduction();
}

/* Avslutande bildsidor från originalet */

function showPersonPage() {
    game.innerHTML = `
        <div class="center-page">
            <h1>Vem är det här?</h1>
            <p class="intro-text">
                Titta på bilden. Klicka på den för att visa ytterligare en bild.
            </p>
            <div class="person-grid" id="personGrid">
                <img src="ulfk2.jpg" alt="Första bilden"
                     onclick="showSecondImage()"
                     title="Klicka för att visa nästa bild">
            </div>
            <p class="small-note">Kan du se vad som skiljer bilderna åt?</p>
            <button class="blue" onclick="showQuizPage()">Fortsätt</button>
        </div>
    `;
}

function showSecondImage() {
    const grid = document.getElementById("personGrid");
    if (!grid || document.getElementById("img2")) return;

    const image = document.createElement("img");
    image.src = "ulfk1.jpg";
    image.id = "img2";
    image.alt = "Den andra bilden";
    grid.appendChild(image);
}

function showQuizPage() {
    game.innerHTML = `
        <div class="center-page">
            <h1>AI eller på riktigt?</h1>
            <p class="intro-text">
                Kan du se skillnad på en AI-video och en riktig?
                <br><br>
                Testa ditt öga i SVT:s quiz!
            </p>
            <a href="https://www.svt.se/special/kan-du-skilja-pa-en-ai-video-och-en-riktig/"
               target="_blank" rel="noopener noreferrer">
                <img src="quiz1.jpg" class="quiz-img"
                     alt="Öppna SVT:s quiz om AI och verkliga videor">
            </a>
            <p class="small-note">Klicka på bilden för att öppna quizet.</p>
            <button class="blue" onclick="showPersonPage()">Tillbaka</button>
        </div>
    `;
}
</script>
